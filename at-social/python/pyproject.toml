[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "autonomous_trust_social"
version = "0.2.1"
description = "AutonomousTrust social feature: position, proximity, profile, connections, DMs, posts, reactions, reports and blocks, business ads and posts, cosign"
authors = ["Sean M Brennan <sean.brennan@tekfive.com>"]
readme = "README.md"
packages = [{include = "autonomous_trust"}]
exclude = ["**/__pycache__"]

[project]
name = "autonomous_trust_social"
version = "0.2.1"

# How an installed core finds the feature (autonomous_trust.core.extensions).
[project.entry-points."autonomous_trust.extensions"]
social = "autonomous_trust.social._at_extension:EXTENSION"

[tool.poetry.dependencies]
python = "^3.13"
autonomous-trust = ">=0.2.1"
