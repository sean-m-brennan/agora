schema_version: "1"
kind: scenario
protocol: social
name: cosign-ask-kc-recite-delivered
byte_pinning: false
description: |
    The Inductor's recitation ask (Phase 5) is carried to the node holding the
    Inductor's key: KC holds one delegation per speaker, so the envoy on the
    governance node cannot also recite the rite, and the recitation is signed
    where the Inductor is.

participants:
  - id: bg
    role: border_guard
  - id: newcomer
    role: new_node

steps:
  - id: 1
    from: bg
    to: newcomer
    function: peer_cosign_request
    payload:
      record: kc_attest
      op: recite
      polity: "did:key:z6MkvZr75pe3PnPy11ixErx25xJ83E6MkqQQc4JpRogj3ytJ"
      cid: "b3:7d3f1c9a2b4e6f80112233445566778899aabbccddeeff00123456789abc1601"
      bytes: "a3011a0066"
      seq: 1
      ts: 0
    description: |
        bg's ask, carrying the recitation's canonical bytes the Inductor's app
        reads before it signs.

expected_state:
  newcomer:
    cosign_request_last:
      bg:
        record: kc_attest
        op: recite
        cid: "b3:7d3f1c9a2b4e6f80112233445566778899aabbccddeeff00123456789abc1601"
        bytes: "a3011a0066"
        seq: 1
