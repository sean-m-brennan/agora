schema_version: "1"
kind: scenario
protocol: social
name: community-follow-replaces-the-held-policy
byte_pinning: false
description: |
    The app hands over a newer policy by following again: the held policy is
    replaced whole, as a newer policy artifact replaces an older one.
participants:
  - id: node
    role: border_guard
steps:
  - id: 1
    from: node
    to: node
    function: trigger_follow_community
    payload: {"community": "did:key:z6MkvZr75pe3PnPy11ixErx25xJ83E6MkqQQc4JpRogj3ytJ", "bundle": "{\"policy\":\"stub\",\"seq\":3}", "seq": 3}
  - id: 2
    from: node
    to: node
    function: trigger_follow_community
    payload: {"community": "did:key:z6MkvZr75pe3PnPy11ixErx25xJ83E6MkqQQc4JpRogj3ytJ", "bundle": "{\"policy\":\"stub\",\"seq\":5}", "seq": 5}
expected_state:
  node:
    communities_followed:
      "did:key:z6MkvZr75pe3PnPy11ixErx25xJ83E6MkqQQc4JpRogj3ytJ": {"seq": 5, "bundle": "{\"policy\":\"stub\",\"seq\":5}"}
    community_policies_emitted: 2
