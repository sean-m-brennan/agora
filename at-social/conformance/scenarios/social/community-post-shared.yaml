schema_version: "1"
kind: scenario
protocol: social
name: community-post-shared
byte_pinning: false
description: |
    A post made in a community's name (Phase 4, Ethne D37) carries a signed
    SCOPE: the community's DID and the author's own labels. Both runtimes verify
    the signature over the scope and record the post with it, unmoderated: the
    core applies no policy, and the app decides what a label does.
participants:
  - id: bg
    role: border_guard
  - id: newcomer
    role: new_node
steps:
  - id: 1
    from: bg
    to: newcomer
    function: peer_post
    payload: {"body": "first harvest", "seq": 1, "ts": 0, "tier": 0, "community": "did:key:z6MkvZr75pe3PnPy11ixErx25xJ83E6MkqQQc4JpRogj3ytJ", "labels": ["nsfw", "spoiler"]}
expected_state:
  newcomer:
    post_last:
      "bg": {"body": "first harvest", "community": "did:key:z6MkvZr75pe3PnPy11ixErx25xJ83E6MkqQQc4JpRogj3ytJ", "labels": ["nsfw", "spoiler"]}
