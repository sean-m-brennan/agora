schema_version: "1"
kind: scenario
protocol: social
name: file-offer-accept-deliver
byte_pinning: false
description: |
    A file in a DM thread, the happy path. alice offers a file; nothing moves
    until node accepts. Then node PULLS: it asks for a window of chunks, writes
    each at its offset, and when every chunk is held it checks the whole file's
    BLAKE2b against the offer, places it, and tells alice it is done.

    The window is 8, so the one request names all three chunks, and the
    arrivals ask for nothing more.

participants:
  - id: node
    role: border_guard
  - id: alice
    role: group_member

steps:
  - id: 1
    from: alice
    to: node
    function: peer_file_offer
    payload: {id: a1b2c3d4e5f60718293a4b5c6d7e8f90, name: notes.txt, content: abc, repeat: 700, chunk: 1024}
    description: alice offers 2100 bytes in three chunks. Nothing moves yet.
  - id: 2
    from: node
    to: node
    function: trigger_file_accept
    payload: {peer: alice, id: a1b2c3d4e5f60718293a4b5c6d7e8f90}
    description: node's person taps Accept.
  - id: 3
    from: node
    to: alice
    function: peer_file_ctl
    in_response_to: 2
    description: node tells alice it accepted.
  - id: 4
    from: node
    to: alice
    function: peer_file_req
    in_response_to: 2
    description: and asks for the whole window, which is all three chunks.
  - id: 5
    from: alice
    to: node
    function: peer_file_chunk
    payload: {id: a1b2c3d4e5f60718293a4b5c6d7e8f90, i: 0, content: abc, repeat: 700, chunk: 1024}
  - id: 6
    from: alice
    to: node
    function: peer_file_chunk
    payload: {id: a1b2c3d4e5f60718293a4b5c6d7e8f90, i: 1, content: abc, repeat: 700, chunk: 1024}
  - id: 7
    from: alice
    to: node
    function: peer_file_chunk
    payload: {id: a1b2c3d4e5f60718293a4b5c6d7e8f90, i: 2, content: abc, repeat: 700, chunk: 1024}
    description: The last chunk. node hashes the whole file, puts it in place and says done.
  - id: 8
    from: node
    to: alice
    function: peer_file_ctl
    in_response_to: 7

expected_state:
  node:
    file_xfer:
      alice: {dir: in, state: 2, done: 2100, name: notes.txt}
    file_frames_emitted:
      peer_file_req: 1
      peer_file_ctl: 2
