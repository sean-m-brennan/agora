schema_version: "1"
kind: scenario
protocol: social
name: cosign-ask-commitment-delivered
byte_pinning: false
description: |
    An ask to co-sign a commitment amendment (Phase 5: a community crosses
    KC's border only with a commitment in force) is carried.

participants:
  - id: bg
    role: border_guard
  - id: newcomer
    role: new_node

steps:
  - id: 1
    from: bg
    to: newcomer
    function: peer_cosign_request
    payload:
      record: commitment
      op: amend
      polity: "did:key:z6MkvZr75pe3PnPy11ixErx25xJ83E6MkqQQc4JpRogj3ytJ"
      cid: "b3:7d3f1c9a2b4e6f80112233445566778899aabbccddeeff00123456789abc1300"
      bytes: "a3011a0066"
      seq: 1
      ts: 0
    description: |
        bg's ask, carrying the exported canonical bytes the newcomer's app
        reads before it signs.

expected_state:
  newcomer:
    cosign_request_last:
      bg:
        record: commitment
        op: amend
        cid: "b3:7d3f1c9a2b4e6f80112233445566778899aabbccddeeff00123456789abc1300"
        bytes: "a3011a0066"
        seq: 1
