schema_version: "1"
kind: scenario
protocol: social
name: file-chunks-out-of-order-and-repeated
byte_pinning: false
description: |
    Chunks arrive in any order and any number of times. There is no freshness
    seq on file frames: the freshness mark keeps one highest seq per sender and
    verb, which would refuse every chunk behind a later one and every retry. Each
    chunk is keyed by (transfer, index) instead, and a duplicate changes nothing.

participants:
  - id: node
    role: border_guard
  - id: alice
    role: group_member

steps:
  - id: 1
    from: alice
    to: node
    function: peer_file_offer
    payload: {id: a1b2c3d4e5f60718293a4b5c6d7e8f90, name: log.txt, content: "0123456789", repeat: 250, chunk: 1024}
  - id: 2
    from: node
    to: node
    function: trigger_file_accept
    payload: {peer: alice, id: a1b2c3d4e5f60718293a4b5c6d7e8f90}
  - id: 3
    from: alice
    to: node
    function: peer_file_chunk
    payload: {id: a1b2c3d4e5f60718293a4b5c6d7e8f90, i: 2, content: "0123456789", repeat: 250, chunk: 1024}
  - id: 4
    from: alice
    to: node
    function: peer_file_chunk
    payload: {id: a1b2c3d4e5f60718293a4b5c6d7e8f90, i: 0, content: "0123456789", repeat: 250, chunk: 1024}
    repeat: 3
    description: A retried request answered three times; one copy counts.
  - id: 5
    from: alice
    to: node
    function: peer_file_chunk
    payload: {id: a1b2c3d4e5f60718293a4b5c6d7e8f90, i: 1, content: "0123456789", repeat: 250, chunk: 1024}

expected_state:
  node:
    file_xfer:
      alice: {dir: in, state: 2, done: 2500}
    file_frames_emitted:
      peer_file_ctl: 2
