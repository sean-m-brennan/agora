schema_version: "1"
kind: scenario
protocol: social
name: community-unfollow-forgets
byte_pinning: false
description: |
    Unfollowing drops the held policy and the follow, and a later carry sends
    nothing.
participants:
  - id: node
    role: border_guard
steps:
  - id: 1
    from: node
    to: node
    function: trigger_follow_community
    payload: {"community": "did:key:z6MkvZr75pe3PnPy11ixErx25xJ83E6MkqQQc4JpRogj3ytJ", "bundle": "{\"policy\":\"stub\",\"seq\":3}", "seq": 3}
  - id: 2
    from: node
    to: node
    function: trigger_unfollow_community
    payload: {"community": "did:key:z6MkvZr75pe3PnPy11ixErx25xJ83E6MkqQQc4JpRogj3ytJ"}
  - id: 3
    from: node
    to: node
    function: trigger_advertise_communities
    payload: {}
expected_state:
  node:
    communities_followed:
      "did:key:z6MkvZr75pe3PnPy11ixErx25xJ83E6MkqQQc4JpRogj3ytJ": {}
    community_policies_emitted: 1
