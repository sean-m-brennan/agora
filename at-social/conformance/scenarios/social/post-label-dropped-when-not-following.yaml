schema_version: "1"
kind: scenario
protocol: social
name: post-label-dropped-when-not-following
byte_pinning: false
description: |
    THE FOLLOW GATE. A label matters only where the community's policy
    applies, so a node that does not follow the community drops it unread and
    does not relay it: carrying labels to nodes that cannot use them is how a
    gossip channel becomes an amplifier.
participants:
  - id: bg
    role: border_guard
  - id: newcomer
    role: new_node
steps:
  - id: 1
    from: bg
    to: newcomer
    function: peer_post_label
    payload: {"community": "did:key:z6MkvZr75pe3PnPy11ixErx25xJ83E6MkqQQc4JpRogj3ytJ", "post_id": "1111111111111111111111111111111111111111111111111111111111111111", "seq": 1, "ts": 0, "bundle": "{\"label\":\"stub\",\"labels\":[\"nsfw\"]}", "hops": 0}
expected_state:
  newcomer:
    post_label_last:
      "1111111111111111111111111111111111111111111111111111111111111111": {}
    post_labels_emitted: 0
