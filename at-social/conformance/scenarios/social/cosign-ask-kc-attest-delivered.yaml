schema_version: "1"
kind: scenario
protocol: social
name: cosign-ask-kc-attest-delivered
byte_pinning: false
description: |
    A rite witness's attestation ask (Phase 5) is carried to the witness's
    own node.

participants:
  - id: bg
    role: border_guard
  - id: newcomer
    role: new_node

steps:
  - id: 1
    from: bg
    to: newcomer
    function: peer_cosign_request
    payload:
      record: kc_attest
      op: attest
      polity: "did:key:z6MkvZr75pe3PnPy11ixErx25xJ83E6MkqQQc4JpRogj3ytJ"
      cid: "b3:7d3f1c9a2b4e6f80112233445566778899aabbccddeeff00123456789abc1600"
      bytes: "a3011a0066"
      seq: 1
      ts: 0
    description: |
        bg's ask, carrying the exported canonical bytes the newcomer's app
        reads before it signs.

expected_state:
  newcomer:
    cosign_request_last:
      bg:
        record: kc_attest
        op: attest
        cid: "b3:7d3f1c9a2b4e6f80112233445566778899aabbccddeeff00123456789abc1600"
        bytes: "a3011a0066"
        seq: 1
