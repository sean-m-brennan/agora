schema_version: "1"
kind: scenario
protocol: social
name: business-post-backfill-needs-the-page
byte_pinning: false
description: |
    A business post arriving by backfill passes the same page gate as one
    arriving by multicast (Agora Phase 4 DDIL): a node that holds no page for
    the polity does not show it, and does not keep it to backfill onward.
participants:
  - id: bg
    role: border_guard
  - id: newcomer
    role: new_node
steps:
  - id: 1
    from: bg
    to: newcomer
    function: peer_post_backfill
    payload:
      kind: biz
      post:
        author: bg
        polity: "did:key:z6MkvZr75pe3PnPy11ixErx25xJ83E6MkqQQc4JpRogj3ytJ"
        seq: 1
        ts: 0
        bundle: '{"post":{"payload":{"polity":"did:key:z6MkvZr75pe3PnPy11ixErx25xJ83E6MkqQQc4JpRogj3ytJ","body":"Fresh croissants at seven.","seq":1},"sig":"stub"},"delegation":{"payload":{"polity":"did:key:z6MkvZr75pe3PnPy11ixErx25xJ83E6MkqQQc4JpRogj3ytJ"},"sig":"stub"}}'
expected_state:
  newcomer:
    business_post_last:
      "did:key:z6MkvZr75pe3PnPy11ixErx25xJ83E6MkqQQc4JpRogj3ytJ": {}
