schema_version: "1"
kind: scenario
protocol: social
name: community-post-bad-label-refused
byte_pinning: false
description: |
    Labels are 1..32 bytes of [a-z0-9_-], one spelling each, so an author's
    label and a policy's name meet without a normalisation step. "NSFW" is
    refused whole, not lower-cased.
participants:
  - id: bg
    role: border_guard
  - id: newcomer
    role: new_node
steps:
  - id: 1
    from: bg
    to: newcomer
    function: peer_post
    payload: {"body": "shouting", "seq": 1, "ts": 0, "tier": 0, "community": "did:key:z6MkvZr75pe3PnPy11ixErx25xJ83E6MkqQQc4JpRogj3ytJ", "labels": ["NSFW"], "signed_community": "did:key:z6MkvZr75pe3PnPy11ixErx25xJ83E6MkqQQc4JpRogj3ytJ", "signed_labels": []}
expected_state:
  newcomer:
    post_last:
      "bg": {"absent": true}
